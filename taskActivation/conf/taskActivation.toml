##### Configuration file: taskActivation (generic real-time task-activation demo) #####
#
# Real-time, registration-free LEFT/RIGHT motor mapping, streaming DICOMs from
# a real (or mock) scanner via dicomDir/. Uses the ds000244 (Individual Brain
# Charting) "HcpMotor" task design as its event timing/GLM template.
# Realtime activation is plotted with nilearn.

title = "Real-Time fMRI Task Activation (ds000244 HcpMotor)"

# ---- generic real-time task-activation demo ----

taskName = "HcpMotor"

# events file (shipped) used to build the per-volume design at runtime.
# If you change subject/acq, copy that run's *_events.tsv here and update this.
eventsFile = "HcpMotor_acq-ap_events.tsv"

# condition display names. cond A = LEFT hand (-> right cortex),
#                          cond B = RIGHT hand (-> left cortex)

# ---- timing ----
demoStep = 2.0             # TR (s). Set to "auto" to infer TR from the first real
                           # DICOM's RepetitionTime instead of hardcoding it (see
                           # demoStepAutoTimeout below).
demoStepAutoTimeout = 30.0 # seconds to wait for that first DICOM when demoStep="auto"
hrf_delay = 2              # ~4 s hemodynamic lag at TR = 2 s
fallbackNVols = 179        # used only if the stream can't report its length

# ---- scanner (DICOM) streaming ----
subjectNum = 101
dicomNamePattern = "demo_{RUN:06d}_{TR:06d}.dcm"   # demo_SeriesNumber_InstanceNumber (zero-padded)
minExpectedDicomSize = 300000
runNum = [1]
dicomTimeout = 30.0        # seconds to wait for EACH volume's DICOM before raising
                           # (rtCommon's own default is only 5s -- too short for a real
                           # scanner's startup gap or an occasional slow volume)

# ---- analysis (registration-free) ----
fwhm = 5                   # smoothing FWHM (mm)
roiRadius = 4              # spherical ROI radius (voxels) on each peak
mapThreshPct = 0.5         # %-signal-change threshold for the per-frame activation overlay
contrastThresh = 2.0       # GLM map threshold (z units when glmZscore=true)
driftOrder = 1             # polynomial drift terms in the GLM (per-run)
glmCondA = "left_hand"     # GLM contrast condA-condB; also used as the display label
glmCondB = "right_hand"    # set empty ("") to plot the condA beta weight instead
glmZscore = true           # z-score the GLM map across voxels
restTypes = []             # trial_types to treat as implicit baseline; [] = auto-detect (rest/fixation/...)
nSlices = 6                # number of axial slices in the mosaic (used when zCuts is empty)
zCuts = []                 # fixed axial slice positions in mm, e.g. [-20,-5,10,25,40,55]; [] = auto
baselineFrames = -1        # -1 = auto: use all frames before the first event as baseline
maskPercentile = 98        # brain mask = ref > maskFraction * p[maskPercentile]
maskMethod = "bet"          # 'bet' (FSL skull-strip; removes skull/neck) | 'epi' | 'threshold'
maskFrac = 0.35             # BET fractional-intensity threshold (lower = larger brain)
maskFraction = 0.12

# ---- realtime display ----
liveEveryTR = 1            # write a live update every N volumes
liveDirName = "live"       # subfolder of rt-cloud/outDir/ the viewer watches
saveGif = true             # at end of run, assemble every saved frame into a
                           # replay-able outDir/live/activation_run<N>.gif
gifFps = 8                 # GIF playback speed (frames/sec)

# ---- web Data Plots tab (LEFT-ROI %SC minus RIGHT-ROI %SC) ----
plotTitle = 'Lateralization (LEFT-ROI minus RIGHT-ROI, % signal change)'
plotXLabel = 'volume #'
plotYLabel = 'LEFT - RIGHT % signal change'
plotXRangeLow = 0
plotXRangeHigh = 180
plotYRangeLow = -2
plotYRangeHigh = 2
plotAutoRangeX = false
plotAutoRangeY = true
